name: AXIMACH build and packages

on:
  push:
    branches: [main, "feat/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aximach-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Check server syntax
        run: |
          node --check server/index.mjs
          node --check server/manufacturing-data.mjs
          node --check server/whatsapp-web.mjs
      - name: Test shared-data merge rules
        run: npm run test:server
      - name: Build application
        run: npm run build
      - name: Verify packaged frontend entrypoint
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const assets = fs.existsSync("dist/assets") ? fs.readdirSync("dist/assets") : [];
          const hasModuleEntrypoint = /<script[^>]+type=["']module["'][^>]+src=/i.test(html);
          if (!hasModuleEntrypoint || !assets.some(name => name.endsWith(".js"))) {
            throw new Error("AXIMACH build is missing its module entrypoint or bundled JavaScript assets.");
          }
          console.log("Verified AXIMACH module entrypoint and JavaScript bundle:", assets.filter(name => name.endsWith(".js")));
          NODE
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: aximach-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Check Electron main-process syntax
        run: node --check electron/main.cjs
      - name: Package Windows installer
        run: npm run package:windows
      - name: Install and launch-test packaged Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $installDir = Join-Path $env:RUNNER_TEMP "AXIMACHSmoke"
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait
          $appExe = Join-Path $installDir "AXIMACH Manufacturing OS.exe"
          if (-not (Test-Path $appExe)) {
            $candidate = Get-ChildItem $installDir -Filter "*.exe" -Recurse | Select-Object -First 1
            if (-not $candidate) { throw "Installed AXIMACH executable was not found in $installDir." }
            $appExe = $candidate.FullName
          }
          $env:AXIMACH_SMOKE_TEST = "1"
          $env:AXIMACH_DATA_FILE = Join-Path $env:RUNNER_TEMP "AXIMACH-smoke-data.json"
          $env:AXIMACH_SMOKE_LOG = Join-Path $env:RUNNER_TEMP "AXIMACH-startup.log"
          $app = Start-Process -FilePath $appExe -PassThru
          if (-not $app.WaitForExit(25000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $env:AXIMACH_SMOKE_LOG) { Get-Content $env:AXIMACH_SMOKE_LOG }
            throw "AXIMACH did not complete its renderer watchdog within 25 seconds."
          }
          if (Test-Path $env:AXIMACH_SMOKE_LOG) { Get-Content $env:AXIMACH_SMOKE_LOG }
          if ($app.ExitCode -ne 0) { throw "AXIMACH renderer or shared-data server smoke test failed with exit code $($app.ExitCode)." }
          if (-not (Select-String -Path $env:AXIMACH_SMOKE_LOG -SimpleMatch "shared-data server smoke check:" -Quiet)) { throw "Packaged AXIMACH did not verify its local shared-data server and authenticated read/write path." }
          Write-Host "PASS: installed AXIMACH app, React workspace and local shared-data server launched; authenticated save/read succeeded."
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: aximach-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Permit private-LAN HTTP connection to the user's PC server
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              text = text.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1) if 'xmlns:android=' not in text else text
              text = text.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android:usesCleartextTraffic=" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text, encoding="utf-8")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          python - <<'PY'
          from pathlib import Path
          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          config = wrapper.read_text(encoding="utf-8")
          original = r"https\://services.gradle.org/distributions/gradle-8.11.1-all.zip"
          mirror = r"https\://mirrors.huaweicloud.com/gradle/gradle-8.11.1-all.zip"
          if original not in config:
              raise SystemExit("Expected Gradle 8.11.1 wrapper URL was not found; refusing an unverified rewrite.")
          wrapper.write_text(config.replace(original, mirror), encoding="utf-8")
          print("Using the pinned Gradle 8.11.1 distribution mirror.")
          PY
          for attempt in 1 2 3; do
            ./gradlew assembleDebug && exit 0
            status=$?
            if [ "$attempt" -eq 1 ]; then
              python - <<'PY'
          from pathlib import Path
          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          config = wrapper.read_text(encoding="utf-8")
          primary = r"https\://mirrors.huaweicloud.com/gradle/gradle-8.11.1-all.zip"
          fallback = r"https\://mirrors.aliyun.com/gradle/distributions/v8.11.1/gradle-8.11.1-all.zip"
          if primary not in config:
              raise SystemExit("Primary Gradle mirror URL changed unexpectedly; refusing an unverified fallback rewrite.")
          wrapper.write_text(config.replace(primary, fallback), encoding="utf-8")
          print("Switching Gradle 8.11.1 download to the secondary distribution mirror.")
          PY
            fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "Gradle build failed; retrying after transient download/build error (attempt $attempt of 3)."
            sleep $((attempt * 15))
          done
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aximach-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  browser-acceptance:
    name: Browser interaction and responsive acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application and browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run module, selector, safe-button and responsive browser sweep
        run: npm run test:browser
