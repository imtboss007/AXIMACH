name: AXIMACH build and packages

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aximach-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server and Electron syntax
        run: |
          node --check server/index.mjs
          node --check server/whatsapp-web.mjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Build application
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: aximach-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install packaged local-service dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Package Windows installer
        run: npm run package:windows
      - name: Smoke-test packaged Windows application
        shell: pwsh
        run: |
          $env:AXIMACH_SMOKE_TEST = "1"
          $env:AXIMACH_SMOKE_USER_DATA = Join-Path $env:RUNNER_TEMP "aximach-smoke-user-data"
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated in release/." }
          $installDir = Join-Path $env:RUNNER_TEMP "AXIMACH-smoke-install"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)." }
          $exe = Join-Path $installDir "AXIMACH Manufacturing OS.exe"
          if (-not (Test-Path $exe)) { throw "Installed application executable not found: $exe" }
          $stdout = Join-Path $env:RUNNER_TEMP "aximach-electron-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "aximach-electron-stderr.log"
          $process = Start-Process -FilePath $exe -ArgumentList @("--aximach-smoke-test", "--aximach-smoke-data-dir=$env:AXIMACH_SMOKE_USER_DATA", "--enable-logging", "--v=1") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(70000)) {
            $log = Join-Path $env:AXIMACH_SMOKE_USER_DATA "logs/startup.log"
            if (Test-Path $log) { Write-Host "=== AXIMACH startup.log ==="; Get-Content $log }
            if (Test-Path $stdout) { Write-Host "=== Electron stdout ==="; Get-Content $stdout -Tail 100 }
            if (Test-Path $stderr) { Write-Host "=== Electron stderr ==="; Get-Content $stderr -Tail 100 }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged application did not finish its startup smoke test within 70 seconds."
          }
          $log = Join-Path $env:AXIMACH_SMOKE_USER_DATA "logs/startup.log"
          if (Test-Path $log) { Write-Host "=== AXIMACH startup.log ==="; Get-Content $log }
          if (Test-Path $stdout) { Write-Host "=== Electron stdout ==="; Get-Content $stdout -Tail 100 }
          if (Test-Path $stderr) { Write-Host "=== Electron stderr ==="; Get-Content $stderr -Tail 100 }
          if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "Windows packaged-renderer smoke test passed" -Quiet)) {
            throw "Packaged application did not report a successful renderer smoke test."
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: aximach-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Permit private-LAN HTTP connection to the user's PC server
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              text = text.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1) if 'xmlns:android=' not in text else text
              text = text.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if "android:usesCleartextTraffic=" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text, encoding="utf-8")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.aximach.manufacturingos -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof com.aximach.manufacturingos
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee android-foreground.txt
            grep -F "com.aximach.manufacturingos" android-foreground.txt
            adb shell screencap -p /sdcard/aximach-screen.png
            adb pull /sdcard/aximach-screen.png aximach-screen.png
            test -s aximach-screen.png
            adb logcat -d -b crash | tee android-crash.log
            ! grep -q "FATAL EXCEPTION" android-crash.log
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aximach-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
