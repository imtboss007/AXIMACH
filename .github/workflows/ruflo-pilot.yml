name: AXIMACH isolated Ruflo pilot

on:
  push:
    branches: ["integrate/35-toolkit-ui-audit"]
    paths:
      - "scripts/ruflo-mcp-smoke.mjs"
      - ".github/workflows/ruflo-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-inventory:
    name: Pinned Ruflo stdio handshake and tool inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout AXIMACH source (not exposed to Ruflo process)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated MCP handshake
        run: node scripts/ruflo-mcp-smoke.mjs
